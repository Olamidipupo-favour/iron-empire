# ============================================================
# Iron Empire — Docker Compose (App + MySQL 8.0)
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: iron_empire
      DATABASE_PASSWORD: iron_empire_secret
      DATABASE_NAME: iron_empire
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - iron-net

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: iron_empire
      MYSQL_USER: iron_empire
      MYSQL_PASSWORD: iron_empire_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - iron-net

volumes:
  mysql-data:
    driver: local

networks:
  iron-net:
    driver: bridge
